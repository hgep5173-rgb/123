site_name: CS2 Lua API
site_description: Документация для скриптов
site_url: https://hgep5173-rgb.github.io/123/

theme:
  name: material
  palette:
    scheme: slate
    primary: deep purple
    accent: cyan
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - assets/stylesheets/extra.css

nav:
  - Главная: index.md
  - Типы данных: types.md
  - Отрисовка (Render): render.md
  - Сущности (Entity): entity.md
  - Движок (Engine): engine.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
