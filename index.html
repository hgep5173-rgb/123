<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CS2 Lua API Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Темная тема -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/themes/dark.css">
  
  <style>
    /* Немного кастомного стиля для красоты */
    :root {
      --theme-color: #00a8ff;
    }
    .app-name-link { font-weight: bold; font-size: 22px; }
  </style>
</head>
<body>
  <div id="app">Загрузка...</div>
  <script>
    window.$docsify = {
      name: 'CS2 Lua API',
      repo: '', /* Сюда можешь вставить ссылку на свой гитхаб */
      loadSidebar: true, // Включаем боковое меню
      subMaxLevel: 2,    // Глубина заголовков в меню
      auto2top: true,
      search: {
        placeholder: 'Поиск...',
        noData: 'Ничего не найдено!',
      }
    }
  </script>
  
  <!-- Скрипты движка -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  <!-- Поиск -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <!-- Подсветка синтаксиса Lua и C++ -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-lua.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
</body>
</html>
